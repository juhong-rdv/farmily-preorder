<style>
.fxm{font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;color:#141413;max-width:780px;margin:0 auto;padding:8px 0 24px}
.fxm *{box-sizing:border-box}
.fxm .fxm-eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:#6B6B68;text-transform:uppercase;margin-bottom:10px}
.fxm h3{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.5px}
.fxm .fxm-sub{margin:0 0 22px;font-size:14px;color:#4A4A48;line-height:1.6}
.fxm .fxm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fxm .fxm-card{display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:150px;padding:20px 20px 18px;border:1px solid #E6E6E2;border-radius:16px;background:#fff;text-decoration:none;color:inherit;cursor:pointer;text-align:left;font:inherit;transition:border-color .15s,transform .15s}
.fxm .fxm-card:hover{border-color:#141413;transform:translateY(-2px)}
.fxm .fxm-card.hi{background:#ccff47;border-color:#ccff47}
.fxm .fxm-card b{display:block;font-size:17px;font-weight:800;margin-bottom:6px}
.fxm .fxm-card span{display:block;font-size:13px;color:#4A4A48;line-height:1.55}
.fxm .fxm-card em{font-style:normal;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.fxm .fxm-card em::after{content:"→"}
.fxm .fxm-card.quiet{background:#FAFAF8}
.fxm .fxm-note{margin:14px 0 0;font-size:12px;color:#6B6B68;line-height:1.6}
.fxm [hidden]{display:none!important}
@media (max-width:760px){.fxm .fxm-grid{grid-template-columns:1fr}.fxm .fxm-card{min-height:0}}
</style>
<div class="fxm" id="fxm">
  <div class="fxm-eyebrow">Member</div>
  <h3>회원 서비스</h3>
  <p class="fxm-sub" id="fxmSub">로그인하시면 사전계약 내역과 결제 영수증을 확인하고, 취소 요청도 직접 하실 수 있습니다.</p>

  <div class="fxm-grid" id="fxmOut">
    <button type="button" class="fxm-card hi" id="fxmLogin"><div><b>로그인</b><span>이메일 또는 카카오·네이버 계정으로 로그인합니다.</span></div><em>로그인하기</em></button>
    <button type="button" class="fxm-card" id="fxmJoin"><div><b>회원가입</b><span>이름·연락처·이메일만으로 1분이면 가입됩니다.</span></div><em>가입하기</em></button>
    <button type="button" class="fxm-card quiet" id="fxmOrderOut"><div><b>사전계약 조회</b><span>결제 내역·영수증 확인과 취소 요청은 로그인 후 이용할 수 있습니다.</span></div><em>로그인 후 조회</em></button>
  </div>

  <div class="fxm-grid" id="fxmIn" hidden>
    <a class="fxm-card hi" href="/shop_mypage/?m2=order"><div><b>내 사전계약 · 주문 조회</b><span>사전계약금 결제 내역과 영수증을 확인하고 취소를 요청합니다.</span></div><em>조회하기</em></a>
    <button type="button" class="fxm-card" id="fxmProfile"><div><b>회원정보 확인 · 수정</b><span>이름, 연락처, 이메일, 비밀번호를 확인하고 변경합니다.</span></div><em>정보 수정</em></button>
    <a class="fxm-card quiet" id="fxmLogout" href="/logout.cm"><div><b>로그아웃</b><span>공용 PC에서는 이용 후 꼭 로그아웃해 주세요.</span></div><em>로그아웃</em></a>
  </div>
  <p class="fxm-note">※ 사전계약 취소는 결제일로부터 10일 이내에 가능하며, 문의는 카카오톡 상담 또는 02-6953-4608로 연락 주세요.</p>
</div>
<script>
(function(){
  var root=document.getElementById('fxm'); if(!root) return;
  var back=btoa(unescape(encodeURIComponent(location.pathname)));
  function memberName(){ var el=document.querySelector('.profile-info .sm-padding'); return el?el.textContent.replace(/\s+/g,' ').trim():''; }
  function isLogin(){ return !!memberName(); }
  function call(fn){ try{ if(window.SITE_MEMBER && typeof SITE_MEMBER[fn]==='function'){ SITE_MEMBER[fn](back); return true; } }catch(e){} return false; }
  function render(){
    var on=isLogin();
    document.getElementById('fxmOut').hidden=on;
    document.getElementById('fxmIn').hidden=!on;
    document.getElementById('fxmSub').textContent=on?(memberName()+'님, 로그인 중입니다. 사전계약 내역 확인, 회원정보 수정, 로그아웃을 이곳에서 할 수 있습니다.'):'로그인하시면 사전계약 내역과 결제 영수증을 확인하고, 취소 요청도 직접 하실 수 있습니다.';
    document.getElementById('fxmLogout').href='/logout.cm?back_url='+back;
  }
  document.getElementById('fxmLogin').onclick=function(){ if(!call('openLogin')) location.href='/login?back_url='+back; };
  document.getElementById('fxmOrderOut').onclick=function(){ if(!call('openLogin')) location.href='/login?back_url='+btoa('/shop_mypage/?m2=order'); };
  document.getElementById('fxmJoin').onclick=function(){ if(!call('openJoin')) location.href='/login?back_url='+back; };
  document.getElementById('fxmProfile').onclick=function(){ if(!call('editProfile')) location.href='/shop_mypage'; };
  render();
  var n=0,t=setInterval(function(){ render(); if(++n>10) clearInterval(t); },500);
})();
</script>
