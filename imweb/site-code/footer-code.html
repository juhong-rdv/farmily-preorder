<script>
(function(){
  'use strict';
  function normalize(path){return path.replace(/\/+$/,'').toLowerCase()||'/';}
  function markCurrentMenu(){
    var root=document.getElementById('farmily-mega-root');
    if(!root)return;
    var path=normalize(location.pathname);
    var sections={
      '/rnd':'/rnd','/greenhousesim':'/rnd',
      '/product':'/product','/farmily-xs300':'/product','/farmily-xuv':'/product','/farmily-xlab':'/product',
      '/pre-order':'/pre-order','/farmilygo':'/farmilygo','/farmilylog':'/farmilylog','/news':'/news','/daily':'/daily',
      '/support':'/support','/qna':'/support','/warranty':'/support'
    };
    var section=sections[path];
    root.querySelectorAll('a.fm-current-section,a.fm-current-page').forEach(function(a){
      a.classList.remove('fm-current-section','fm-current-page');a.removeAttribute('aria-current');
    });
    if(!section)return;
    var article=new URLSearchParams(location.search).has('idx');
    root.querySelectorAll('.fm-nav a[href]').forEach(function(a){
      if(normalize(new URL(a.href,location.href).pathname)!==section)return;
      a.classList.add('fm-current-section');
      a.setAttribute('aria-current',path===section&&!article?'page':'true');
    });
    root.querySelectorAll('.fm-resource-col>a,.fm-product-main,.fm-guide>a[href="/product"]').forEach(function(a){
      if(normalize(new URL(a.href,location.href).pathname)!==path||article)return;
      a.classList.add('fm-current-page');a.setAttribute('aria-current','page');
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',markCurrentMenu,{once:true});
  else markCurrentMenu();
  window.addEventListener('popstate',markCurrentMenu);
})();
</script>

<script>
(function(){
 function alignArticleImages(){
  document.querySelectorAll('.board_txt_area img').forEach(function(img){
   function align(){
    var width=img.style.width,attr=img.getAttribute('width');
    var small=(width.endsWith('px')&&parseFloat(width)<600)||(attr&&parseFloat(attr)<600);
    if(img.naturalWidth>=600&&!small)img.classList.add('fm-wide-image');
   }
   if(img.complete)align();else img.addEventListener('load',align,{once:true});
  });
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',alignArticleImages,{once:true});else alignArticleImages();
})();
</script>

<script>
(function(){
  function b64(p){ try{ return btoa(unescape(encodeURIComponent(p))); }catch(e){ return ''; } }
  function memberName(){ var el=document.querySelector('.profile-info .sm-padding'); return el?el.textContent.replace(/\s+/g,' ').trim():''; }
  function call(fn,back){ try{ if(window.SITE_MEMBER&&typeof SITE_MEMBER[fn]==='function'){ SITE_MEMBER[fn](back); return true; } }catch(e){} return false; }
  function set(id,text,href,onclick,small,hide){
    var a=document.getElementById(id); if(!a) return;
    a.textContent=text; a.href=href; a.onclick=onclick||null; a.classList.toggle('fm-member-small',!!small); a.hidden=!!hide;
  }
  function apply(){
    var a=document.getElementById('fm-member-a'), b=document.getElementById('fm-member-b'), c=document.getElementById('fm-member-c');
    if(!a||!b||!c) return false;
    var name=memberName(), on=!!name, back=b64(location.pathname);
    if(on){
      set('fm-member-a', name+'님 · 내 정보', '/shop_mypage', function(e){ if(call('editProfile',back)) e.preventDefault(); });
      set('fm-member-b', '내 사전계약 · 주문 조회', '/shop_mypage/?m2=order');
      set('fm-member-c', '로그아웃', '/logout.cm?back_url='+back, null, true, false);
    }else{
      set('fm-member-a', '로그인', '/login?back_url='+back, function(e){ if(call('openLogin',back)) e.preventDefault(); });
      set('fm-member-b', '회원가입', '/login?back_url='+back, function(e){ if(call('openJoinPatternChoice',back)||call('openJoin',back)) e.preventDefault(); });
      set('fm-member-c', '', '#', null, false, true);
    }
    return true;
  }
  var n=0,t=setInterval(function(){ if(apply()&&n>3) clearInterval(t); if(++n>40) clearInterval(t); },300);
})();
</script>
<script>
(function(){
  /* 사전계약금 상품 상세(/shop_view/?idx=8|9)는 구성기(/pre-order)로 보냄 — 주문서의 상품 링크 등에서 유입 시 혼동 방지 */
  if (location.pathname.indexOf('/shop_view') !== 0 || /fxdev=1/.test(location.search)) return;
  var idx = new URLSearchParams(location.search).get('idx');
  if (idx === '8') location.replace('/pre-order');
  else if (idx === '9') location.replace('/pre-order?model=uv');
})();
</script>
