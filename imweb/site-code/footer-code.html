<script>
(function(){
  'use strict';
  function normalize(path){return path.replace(/\/+$/,'').toLowerCase()||'/';}
  function markCurrentMenu(){
    var root=document.getElementById('farmily-mega-root');
    if(!root)return;
    var path=normalize(location.pathname);
    var sections={
      '/rnd':'/rnd','/greenhousesim':'/rnd',
      '/product':'/product','/farmily-xs300':'/product','/farmily-xuv':'/product','/farmily-xlab':'/product',
      '/pre-order':'/pre-order','/farmilygo':'/farmilygo','/farmilylog':'/farmilylog','/news':'/news','/daily':'/daily',
      '/support':'/support','/qna':'/support','/warranty':'/support'
    };
    var section=sections[path];
    root.querySelectorAll('a.fm-current-section,a.fm-current-page').forEach(function(a){
      a.classList.remove('fm-current-section','fm-current-page');a.removeAttribute('aria-current');
    });
    if(!section)return;
    var article=new URLSearchParams(location.search).has('idx');
    root.querySelectorAll('.fm-nav a[href]').forEach(function(a){
      if(normalize(new URL(a.href,location.href).pathname)!==section)return;
      a.classList.add('fm-current-section');
      a.setAttribute('aria-current',path===section&&!article?'page':'true');
    });
    root.querySelectorAll('.fm-resource-col>a,.fm-product-main,.fm-guide>a[href="/product"]').forEach(function(a){
      if(normalize(new URL(a.href,location.href).pathname)!==path||article)return;
      a.classList.add('fm-current-page');a.setAttribute('aria-current','page');
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',markCurrentMenu,{once:true});
  else markCurrentMenu();
  window.addEventListener('popstate',markCurrentMenu);
})();
</script>

<script>

  var DATE=/(20\d\d)-(\d\d)-(\d\d)/;
  function blockOf(el){ for(var k=0;k<9;k++){ if(!el) return null; if(DATE.test(el.textContent||'')) return el; el=el.parentElement; } return null; }
  function daysSince(block){ var m=(block.textContent||'').match(DATE); if(!m) return 0; var d=new Date(+m[1],+m[2]-1,+m[3]); var t=new Date(); t=new Date(t.getFullYear(),t.getMonth(),t.getDate()); return Math.round((t-d)/864e5); }

  /* 1) 상단 공지 띠 (구성기·결제·마이페이지 제외, 닫으면 이번 방문 동안 숨김) */
  function notice(){
    if(HIDE) return; if(ss('fx_notice_off')==='1') return; if(document.getElementById('fx-notice')) return;
    var n=document.createElement('div'); n.id='fx-notice';
    n.innerHTML='<a class="fx-n-link" href="'+LINK+'"><span class="fx-n-tag">공동구매</span>'+
      '<span class="fx-n-long">2027 사전계약(공동구매) 진행 중 · 1대당 150만원 할인 · 사전계약금 10만원</span>'+
      '<span class="fx-n-short">2027 사전계약 · 1대당 150만원 할인</span>'+
      '<span class="fx-n-more">신청하기 →</span></a><button type="button" aria-label="공지 닫기">×</button>';
    n.querySelector('button').onclick=function(){ n.remove(); document.documentElement.classList.remove('fx-notice'); document.body.style.removeProperty('padding-top'); ss('fx_notice_off','1'); };
    var pt=parseFloat(getComputedStyle(document.body).paddingTop)||0;
    document.body.insertBefore(n,document.body.firstChild);
    document.documentElement.classList.add('fx-notice');
    document.body.style.setProperty('padding-top',(pt+34)+'px','important');
  }

  /* 2) 메인 연두색 띠: 도입 문의 → 사전계약(공동구매) 신청 */
  function band(){
    if(P!=='/') return;
    var t=document.getElementById('text_w20251023127d926f9df27'); if(!t) return;
    var s=t.querySelector('strong'); if(!s) return;
    if(s.getAttribute('data-fx')==='1') return;
    s.textContent='2027 사전계약(공동구매) 신청하기 →'; s.setAttribute('data-fx','1');
    var a=t.closest('a'); if(a) a.setAttribute('href',LINK);
  }

  /* 3) 메인 첫 방문 팝업 (오늘 하루 보지 않기) */
  function today(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  function pop(){
    if(P!=='/') return; if(ls('fx_pop_skip')===today()) return; if(ss('fx_pop_seen')==='1') return; if(document.getElementById('fx-pop')) return;
    var w=document.createElement('div'); w.id='fx-pop'; w.setAttribute('role','dialog'); w.setAttribute('aria-modal','true'); w.setAttribute('aria-label','2027 사전계약 공동구매 안내');
    w.innerHTML='<div class="fx-p-card">'+
      '<div class="fx-p-top"><span class="fx-p-kicker">2027 사전계약 · 공동구매</span>'+
      '<h3>2027년 농사 시즌,<br>FARMILY-X 미리 준비하세요</h3>'+

      '<button type="button" class="fx-p-x" aria-label="닫기">×</button></div>'+
      '<ul>'+
      '<li><b>사전계약 할인</b><span>잔금에서 <strong>1대당 150만원</strong> 할인</span></li>'+
      '<li><b>오늘 결제</b><span>사전계약금 <strong>10만원</strong> · 결제일로부터 7일 이내 취소 접수 가능</span></li>'+
      '<li><b>기념 선물</b><span>사전계약 고객 전원 FARMILY 바람막이 자켓 제공</span></li>'+
      '<li><b>구매 수량</b><span>회원 계정당 모델별 최대 5대</span></li>'+
      '</ul>'+
      '<a class="fx-p-cta" href="'+LINK+'">사전계약 신청하기</a>'+
      '<div class="fx-p-foot"><button type="button" class="fx-p-today">오늘 하루 보지 않기</button><button type="button" class="fx-p-close">닫기</button></div>'+
      '</div>';
    function close(){ w.remove(); document.removeEventListener('keydown',esc); ss('fx_pop_seen','1'); }
    function esc(e){ if(e.key==='Escape') close(); }
    w.addEventListener('click',function(e){ if(e.target===w) close(); });
    w.querySelector('.fx-p-x').onclick=close; w.querySelector('.fx-p-close').onclick=close;
    w.querySelector('.fx-p-today').onclick=function(){ ls('fx_pop_skip',today()); close(); };
    w.querySelector('.fx-p-cta').addEventListener('click',function(){ ss('fx_pop_seen','1'); });
    document.addEventListener('keydown',esc);
    document.body.appendChild(w);
  }

  function run(){ notice(); band(); }
  function go(){ run(); setTimeout(pop,700); var n=0, t=setInterval(function(){ band(); if(++n>20) clearInterval(t); },300); }
  /* 국내(KR) 접속에만 표시: Header Code의 접속 국가 판별(fx_geo_cc) 결과를 기다렸다가 KR일 때만 실행, 판별 실패·해외면 표시하지 않음 */
  function gate(){ var k=0; (function chk(){ var cc=ss('fx_geo_cc'); if(cc==='KR') return go(); if(cc) return; if(++k>30) return; setTimeout(chk,200); })(); }
  if(document.body) gate(); else document.addEventListener('DOMContentLoaded',gate);
})();</script>
