<script>/* FARMILY 사전계약 주문서: 옵션 한 줄 → 항목별 사양표 (fx-order-spec) */
(function(){
  if(!/^\/(shop_payment|shop_payment_complete)/.test(location.pathname)) return;
  var RULES=[
    [/^잔금/, '결제 조건', function(v){return v;}],
    [/^자켓/, '기념 자켓', function(v){return v.replace(/^자켓\s*/,'');}],
    [/^온실/, '온실 정보', function(v){return v==='온실 정보 없음'?'입력 안 함':v.replace(/^온실:\s*/,'');}],
    [/컬러/, '색상', function(v){return v;}],
    [/고정형|리프트/, '리프트', function(v){return v;}],
    [/센서/, '안전 센서', function(v){return v;}],
    [/LTE/, 'LTE·케어서비스', function(v){return v;}],
    [/농업|일반|사업자|개인/, '구매자 구분', function(v){return v;}]
  ];
  var ORDER=['모델','색상','리프트','안전 센서','LTE·케어서비스','구매자 구분','결제 조건','기념 자켓','온실 정보','수량'];
  var css=document.createElement('style');
  css.textContent='.fx-spec-hide{display:none!important}'+
    '.fx-spec{margin:10px 0 2px;border:1px solid #d9e2dc;border-radius:8px;background:#f6f9f7;padding:12px 14px;font-size:13px;line-height:1.5;color:#171a20}'+
    '.fx-spec h4{margin:0 0 8px;font-size:12px;font-weight:600;color:#1c524e;letter-spacing:.2px}'+
    '.fx-spec dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0}'+
    '.fx-spec dt{color:#6d7470;white-space:nowrap}.fx-spec dd{margin:0;font-weight:500;word-break:keep-all}'+
    '.fx-spec a{display:inline-block;margin-top:10px;font-size:12px;color:#1c524e;text-decoration:underline;text-underline-offset:3px}'+
    '@media(max-width:767px){.fx-spec{font-size:13.5px;padding:12px}}';
  document.head.appendChild(css);
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function build(span){
    var txt=span.textContent.trim(); var m=txt.match(/\s-\s(\d+)개$/); var qty=m?m[1]+'대':'';
    if(m) txt=txt.slice(0,m.index);
    var parts=txt.split(' / '), rows={}, extra=[];
    parts.forEach(function(v){v=v.trim(); if(!v) return; for(var i=0;i<RULES.length;i++){ if(RULES[i][0].test(v)&&!rows[RULES[i][1]]){ rows[RULES[i][1]]=RULES[i][2](v); return; } } extra.push(v); });
    var card=span.closest('div'); for(var k=0;k<3&&card&&!/FARMILY-X/.test(card.textContent);k++) card=card.parentElement;
    var name=card?card.textContent:''; rows['모델']=/FARMILY-X\s*UV/.test(name)?'FARMILY-X UV':'FARMILY-X S300';
    if(qty) rows['수량']=qty;
    var html='<h4>선택하신 사양</h4><dl>';
    ORDER.forEach(function(k){ if(rows[k]) html+='<dt>'+k+'</dt><dd>'+esc(rows[k])+'</dd>'; });
    extra.forEach(function(v){ html+='<dt>기타</dt><dd>'+esc(v)+'</dd>'; });
    html+='</dl>';
    var box=document.createElement('div'); box.className='fx-spec'; box.innerHTML=html; return box;
  }
  function apply(){
    var spans=document.querySelectorAll('span');
    for(var i=0;i<spans.length;i++){
      var s=spans[i]; if(s.children.length) continue;
      var t=s.textContent; if(!/^잔금 .+ \/ 자켓 /.test(t)) continue;
      var p=s.parentElement; if(!p) continue;
      var next=p.nextElementSibling;
      if(next&&next.classList.contains('fx-spec')&&next.getAttribute('data-src')===t) continue;
      if(next&&next.classList.contains('fx-spec')) next.remove();
      var box=build(s); box.setAttribute('data-src',t);
      p.classList.add('fx-spec-hide'); p.parentNode.insertBefore(box,p.nextSibling);
    }
  }
  var busy=false; var mo=new MutationObserver(function(){ if(busy) return; busy=true; setTimeout(function(){ busy=false; apply(); },60); });
  function start(){ apply(); mo.observe(document.body,{childList:true,subtree:true}); }
  if(document.body) start(); else document.addEventListener('DOMContentLoaded',start);
})();</script>
