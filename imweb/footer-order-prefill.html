<!-- 공통 코드 삽입 > Footer Code 에 추가된 스크립트: 사전계약 구성기 → 아임웹 주문서(/shop_payment) 배송메모 자동 입력 -->
<script>
(function(){
  if (location.pathname.indexOf('/shop_payment') !== 0) return;
  var spec = ''; try { spec = sessionStorage.getItem('fx_spec') || ''; } catch (e) {}
  if (!spec) return;
  function setVal(el, val, proto){ var set = Object.getOwnPropertyDescriptor(proto, 'value').set; set.call(el, val); el.dispatchEvent(new Event(proto === HTMLSelectElement.prototype ? 'change' : 'input', { bubbles: true })); }
  var n = 0, done = false, memoDone = false;
  var t = setInterval(function(){
    if (++n > 60) { clearInterval(t); return; }
    if (!memoDone) {
      var sel = Array.prototype.find.call(document.querySelectorAll('select'), function(s){ return Array.prototype.some.call(s.options, function(o){ return o.value === '직접입력'; }); });
      if (sel) { if (sel.value !== '직접입력') setVal(sel, '직접입력', HTMLSelectElement.prototype); memoDone = true; }
    }
    var inp = Array.prototype.find.call(document.querySelectorAll('input'), function(i){ return (i.placeholder || '').indexOf('배송메모를 입력') === 0; });
    if (inp && !inp.value) { setVal(inp, '[사전계약 구성] ' + spec, HTMLInputElement.prototype); done = true; }
    if (done) { clearInterval(t); try { sessionStorage.removeItem('fx_spec'); } catch (e) {} }
  }, 300);
})();
</script>
